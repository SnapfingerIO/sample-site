<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lucent</title>
    <link rel="stylesheet" href="styles.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three/three.module.js"
        }
      }
    </script>
  </head>
  <body>
    <header class="site-header">
      <p class="eyebrow">Lantern Room</p>
      <h1>Lucent</h1>
      <p class="lede">Nine coasts, after dark.</p>
    </header>

    <canvas id="room-view" aria-hidden="true"></canvas>
    <p id="hover-label" hidden></p>

    <main>
      <ul class="grid" id="grid" aria-label="Exhibition"></ul>
    </main>

    <div class="lightbox" id="lightbox" hidden>
      <div class="lightbox-backdrop" data-close></div>
      <div
        class="lightbox-dialog"
        role="dialog"
        aria-modal="true"
        aria-labelledby="lightbox-title"
      >
        <p class="lightbox-count" id="lightbox-title"></p>
        <button class="nav prev" type="button" aria-label="Previous artwork">
          <span aria-hidden="true">‹</span>
        </button>
        <figure>
          <img id="lightbox-image" alt="" />
          <figcaption id="lightbox-caption"></figcaption>
        </figure>
        <button class="nav next" type="button" aria-label="Next artwork">
          <span aria-hidden="true">›</span>
        </button>
        <button class="close" type="button" data-close aria-label="Close">
          Esc
        </button>
      </div>
    </div>

    <script type="module" src="script.js"></script>
  </body>
</html>
