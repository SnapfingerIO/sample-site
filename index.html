<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lucent</title>
    <link rel="stylesheet" href="styles.css" />
    <script>
      try {
        const probe = document.createElement("canvas");
        if (probe.getContext("webgl2") || probe.getContext("webgl")) {
          document.documentElement.classList.add("intro");
        }
      } catch {}
    </script>
    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three/three.module.js"
        }
      }
    </script>
  </head>
  <body>
    <div id="intro" aria-hidden="true">
      <p class="intro-mark">Lucent</p>
    </div>

    <header class="site-header">
      <p class="eyebrow">Lantern Room</p>
      <h1>Lucent</h1>
      <p class="lede">Nine coasts, after dark.</p>
    </header>

    <canvas id="room-view" aria-hidden="true"></canvas>
    <p id="hover-label" hidden></p>
    <button id="room-back" type="button" hidden>
      <span aria-hidden="true">‹</span> Back to the room
    </button>
    <button id="sound-toggle" type="button" aria-label="Ocean sound" aria-pressed="false" hidden>
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
        <path d="M4 9.5h3.2L12 5.6v12.8l-4.8-3.9H4z" fill="currentColor" />
        <path
          class="sound-on"
          d="M15.4 9.2a4 4 0 0 1 0 5.6M17.9 6.8a7.4 7.4 0 0 1 0 10.4"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
        />
        <path
          class="sound-off"
          d="M15.8 9.8l4.4 4.4M20.2 9.8l-4.4 4.4"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
        />
      </svg>
    </button>

    <main>
      <ul class="grid" id="grid" aria-label="Exhibition"></ul>
    </main>

    <div class="lightbox" id="lightbox" hidden>
      <div class="lightbox-backdrop" data-close></div>
      <div
        class="lightbox-dialog"
        role="dialog"
        aria-modal="true"
        aria-labelledby="lightbox-title"
      >
        <p class="lightbox-count" id="lightbox-title"></p>
        <button class="nav prev" type="button" aria-label="Previous artwork">
          <span aria-hidden="true">‹</span>
        </button>
        <figure>
          <img id="lightbox-image" alt="" />
          <figcaption id="lightbox-caption"></figcaption>
        </figure>
        <button class="nav next" type="button" aria-label="Next artwork">
          <span aria-hidden="true">›</span>
        </button>
        <button class="close" type="button" data-close aria-label="Close">
          Esc
        </button>
      </div>
    </div>

    <script type="module" src="script.js"></script>
  </body>
</html>
